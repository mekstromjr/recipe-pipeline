[project]
name = "recipe-pipeline-worker"
version = "0.1.0"
description = "Worker: render PDF -> glm-ocr (<pve-host>) -> structure -> enrich -> review."
requires-python = ">=3.12"
dependencies = [
    "recipe-pipeline-shared",
    "httpx>=0.28.1",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.7.0",
    "pillow>=11.1.0",
    "pypdfium2>=4.30.0",
    "deskew>=1.5.1",
    "jiwer>=3.1.0",
]

[project.scripts]
recipe-pipeline = "recipe_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recipe_pipeline"]

[tool.uv.sources]
recipe-pipeline-shared = { workspace = true }
