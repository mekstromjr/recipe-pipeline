[project]
name = "recipe-pipeline-shared"
version = "0.1.0"
description = "Shared Recipe model + slug for the recipe service (imported by worker AND server)."
requires-python = ">=3.12"
# Dependency-light on purpose: pydantic + stdlib only, so the server image stays free of
# worker-only OCR/image deps.
dependencies = [
    "pydantic>=2.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recipe_pipeline_shared"]
