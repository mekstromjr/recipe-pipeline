[project]
name = "recipe-pipeline-server"
version = "0.1.0"
description = "Recipe service control plane (FastAPI, k8s)."
requires-python = ">=3.12"
# NEVER add Apple Vision / pyobjc here — the server does not OCR.
dependencies = [
    "recipe-pipeline-shared",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.3",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic-settings>=2.7.0",
    "boto3>=1.35.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recipe_pipeline_server"]

[tool.uv.sources]
recipe-pipeline-shared = { workspace = true }
