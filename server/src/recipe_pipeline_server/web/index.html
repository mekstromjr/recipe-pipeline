<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recipe review</title>
<style>
  :root{--bg:#15171c;--panel:#1d2027;--line:#2c313c;--fg:#e6e8ec;--mut:#8b93a3;--acc:#5b9cff;
        --ok:#46b35e;--warn:#d9a13a;--rej:#c2554f;}
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;display:flex;height:100vh}
  /* sidebar */
  #side{width:280px;flex:0 0 280px;border-right:1px solid var(--line);overflow:auto;background:var(--panel)}
  #side h1{font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);margin:0;padding:14px 14px 4px;display:flex;justify-content:space-between}
  #side h1 a{color:var(--acc);text-decoration:none;font-weight:400;text-transform:none;letter-spacing:0}
  #who{padding:0 14px 4px;color:var(--mut);font-size:11px}
  #prog{padding:0 14px 10px;color:var(--mut);font-size:12px}
  .item{padding:8px 14px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:8px;align-items:baseline}
  .item:hover{background:#232732} .item.cur{background:#27314a}
  .item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .conf{color:var(--mut);font-size:11px;flex:0 0 auto}
  /* main */
  #main{flex:1;display:flex;min-width:0}
  #scan{flex:1;overflow:auto;background:#0e0f12;padding:16px;text-align:center}
  #scan img{max-width:100%;margin-bottom:12px;border-radius:6px;box-shadow:0 2px 12px #0008}
  #edit{width:46%;flex:0 0 46%;border-left:1px solid var(--line);overflow:auto;padding:18px 20px}
  .row{margin-bottom:14px} label{display:block;color:var(--mut);font-size:12px;margin-bottom:4px;text-transform:uppercase;letter-spacing:.03em}
  input,textarea{width:100%;background:#12141a;border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:8px 10px;font:inherit;resize:vertical}
  textarea{min-height:120px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
  #name{font-size:17px;font-weight:600}
  .badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .b{font-size:11px;padding:2px 8px;border-radius:999px;background:#2a2f3a;color:var(--mut)}
  .b.conf{background:#1f3a26;color:#9be0ab} .b.lowconf{background:#3a2520;color:#e6a79e}
  .bar{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:12px;margin:18px -20px -18px;display:flex;gap:8px;flex-wrap:wrap}
  button{font:inherit;border:0;border-radius:6px;padding:9px 14px;cursor:pointer;font-weight:600}
  button:disabled{opacity:.5;cursor:default}
  .save{background:#2c313c;color:var(--fg)} .approve{background:var(--ok);color:#06210f}
  .reject{background:var(--rej);color:#2a0c0a} .nav{background:#2c313c;color:var(--mut)}
  details{margin-top:6px} summary{cursor:pointer;color:var(--mut);font-size:12px}
  pre{white-space:pre-wrap;background:#12141a;border:1px solid var(--line);border-radius:6px;padding:10px;font-size:12px;color:var(--mut)}
  .hint{color:var(--mut);font-size:11px;margin-top:4px}
  #empty{margin:auto;color:var(--mut);text-align:center;padding:40px}
  #err{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;background:#3a2520;color:#e6a79e;
       border:1px solid var(--rej);border-radius:8px;padding:10px 16px;display:none;max-width:90%;z-index:10}
  /* status view */
  #status{flex:1;overflow:auto;padding:20px;display:none}
  #status h2{font-size:15px;margin:18px 0 8px}
  .cards{display:flex;gap:10px;flex-wrap:wrap}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 18px;min-width:110px}
  .card .n{font-size:22px;font-weight:700} .card .l{color:var(--mut);font-size:12px}
  table{border-collapse:collapse;width:100%;font-size:13px}
  td,th{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left}
  th{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.03em}
  /* phone: stack everything */
  @media (max-width: 900px){
    body{flex-direction:column;height:auto;min-height:100vh}
    #side{width:100%;flex:0 0 auto;max-height:35vh;border-right:0;border-bottom:1px solid var(--line)}
    #main{flex-direction:column}
    #scan{max-height:45vh;flex:0 0 auto}
    #edit{width:100%;flex:1 1 auto;border-left:0;border-top:1px solid var(--line)}
    .bar{position:sticky}
    button{padding:12px 16px}
  }
</style></head>
<body>
  <div id="side">
    <h1>Needs review <a href="#" onclick="toggleStatus(event)">status</a></h1>
    <div id="who"></div><div id="prog"></div><div id="list"></div>
  </div>
  <div id="main">
    <div id="scan"></div>
    <div id="edit"></div>
  </div>
  <div id="status"></div>
  <div id="err"></div>
<script>
let Q=[], cur=-1, busy=false;
const $=s=>document.querySelector(s);
async function jfetch(url, opts){
  const r=await fetch(url, opts);
  if(!r.ok){ let d=''; try{ d=(await r.json()).detail||''; }catch(e){}
    throw new Error(d || (r.status+' '+r.statusText)); }
  return r.json();
}
function err(msg){ const e=$('#err'); e.textContent=msg; e.style.display='block';
  clearTimeout(err.t); err.t=setTimeout(()=>e.style.display='none', 6000); }
async function load(){
  try{ const me=await jfetch('/api/me'); $('#who').textContent='signed in as '+me.user; }catch(e){}
  Q=await jfetch('/api/queue'); renderList();
  if(Q.length) open(0); else $('#scan').innerHTML='<div id=empty>Queue is empty — nothing needs review.</div>';
}
function renderList(){
  $('#prog').textContent=Q.length+' left to review';
  $('#list').innerHTML=Q.map((r,i)=>`<div class="item ${i===cur?'cur':''}" onclick="open(${i})">
      <span class="nm">${esc(r.name)}</span>
      <span class="conf">${(r.confidence*100|0)}%</span></div>`).join('');
}
async function open(i){ if(i<0||i>=Q.length){ if(!Q.length) location.reload(); return; }
  cur=i; renderList(); showReview();
  document.querySelectorAll('.item')[i]?.scrollIntoView({block:'nearest'});
  const r=await jfetch('/api/recipes/'+Q[i].id);
  $('#scan').innerHTML=r.pages.map(p=>`<img src="/api/recipes/${r.id}/pages/${p}" loading="lazy">`).join('')||'<div id=empty>no scan image</div>';
  $('#scan').scrollTop=0;
  const lc=r.confidence!=null&&r.confidence<0.7;
  $('#edit').innerHTML=`
    <div class="badges">
      <span class="b ${lc?'lowconf':'conf'}">confidence ${r.confidence!=null?(r.confidence*100|0)+'%':'?'}</span>
      ${r.flags.map(f=>`<span class="b">${esc(f)}</span>`).join('')}</div>
    <div class="row"><label>Title</label><input id="name" value="${esc(r.name)}"></div>
    <div class="row"><label>Description</label><input id="desc" value="${esc(r.description)}"></div>
    <div class="row"><label>Ingredients (one per line)</label><textarea id="ings">${esc(r.ingredients.join('\n'))}</textarea></div>
    <div class="row"><label>Instructions (one per line / step)</label><textarea id="insts">${esc(r.instructions.join('\n'))}</textarea></div>
    <details><summary>verbatim OCR (what was actually scanned)</summary><pre>${esc(r.verbatim||'(none)')}</pre></details>
    <div class="hint">Approve sends it to Mealie. Reject = not a recipe (permanent). Arrows just move on.</div>
    <div class="bar">
      <button class="nav" onclick="open(cur-1)">&larr;</button>
      <button class="save" onclick="save()">Save</button>
      <button class="approve" onclick="approve()">Approve &rarr; Mealie</button>
      <button class="reject" onclick="reject_()">Reject</button>
      <button class="nav" onclick="open(cur+1)">&rarr;</button>
    </div>`;
}
function payload(){return{name:$('#name').value, description:$('#desc').value,
  ingredients:$('#ings').value.split('\n').map(s=>s.trim()).filter(Boolean),
  instructions:$('#insts').value.split('\n').map(s=>s.trim()).filter(Boolean)};}
async function save(silent){
  await jfetch('/api/recipes/'+Q[cur].id,{method:'PATCH',
    headers:{'Content-Type':'application/json'},body:JSON.stringify(payload())});
  if(!silent) flash('saved');
}
async function approve(){
  if(busy) return; busy=true;
  const b=document.querySelector('.approve'), o=b.textContent;
  b.disabled=true; b.textContent='Sending to Mealie…';
  try{
    await save(true);
    const job=await jfetch('/api/recipes/'+Q[cur].id+'/approve',{method:'POST'});
    dropCurrent();
  }catch(e){ err('Approve failed: '+e.message); b.disabled=false; b.textContent=o; }
  finally{ busy=false; }
}
async function reject_(){
  if(busy) return;
  if(!confirm('Reject permanently? Use this only for things that are not recipes.')) return;
  busy=true;
  try{ await jfetch('/api/recipes/'+Q[cur].id+'/reject',{method:'POST'}); dropCurrent(); }
  catch(e){ err('Reject failed: '+e.message); }
  finally{ busy=false; }
}
function dropCurrent(){ Q.splice(cur,1); if(cur>=Q.length) cur=Q.length-1;
  renderList(); if(Q.length) open(cur); else { $('#edit').innerHTML=''; $('#scan').innerHTML='<div id=empty>All done — the queue is empty.</div>'; } }
function flash(t){const b=document.querySelector('.save');const o=b.textContent;b.textContent=t;setTimeout(()=>b.textContent=o,800);}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
async function toggleStatus(ev){ ev.preventDefault();
  const st=$('#status'), main=$('#main');
  if(st.style.display==='block'){ st.style.display='none'; main.style.display='flex'; return; }
  const s=await jfetch('/api/status');
  const order=['needs_review','uploaded','rejected','failed','queued','processing','approved'];
  st.innerHTML='<div class="cards">'+order.filter(k=>s.counts[k]).map(k=>
      `<div class="card"><div class="n">${s.counts[k]}</div><div class="l">${k.replace('_',' ')}</div></div>`).join('')+'</div>'
    +'<h2>Recent decisions</h2><table><tr><th>source</th><th>status</th><th>by</th><th>when</th><th>mealie</th></tr>'
    +s.recent.map(r=>`<tr><td>${esc(r.source_name)}</td><td>${r.status}</td><td>${esc(r.by||'')}</td>
       <td>${new Date(r.at).toLocaleString()}</td><td>${esc(r.mealie_slug||'')}</td></tr>`).join('')+'</table>';
  main.style.display='none'; st.style.display='block';
}
document.addEventListener('keydown',e=>{ if(e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT'){
    if((e.metaKey||e.ctrlKey)&&e.key==='s'){e.preventDefault();save();} return; }
  if(e.key==='ArrowLeft')open(cur-1); else if(e.key==='ArrowRight')open(cur+1);
  else if(e.key==='s')save(); else if(e.key==='a')approve(); });
function showReview(){ $('#status').style.display='none'; $('#main').style.display='flex'; }
load();
</script></body></html>
