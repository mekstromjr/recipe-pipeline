<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recipe review</title>
<style>
  :root{--bg:#15171c;--panel:#1d2027;--line:#2c313c;--fg:#e6e8ec;--mut:#8b93a3;--acc:#5b9cff;
        --ok:#46b35e;--warn:#d9a13a;--rej:#c2554f;}
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;display:flex;height:100vh}
  /* sidebar */
  #side{width:280px;flex:0 0 280px;border-right:1px solid var(--line);overflow:auto;background:var(--panel)}
  #side h1{font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);margin:0;padding:14px 14px 4px;display:flex;justify-content:space-between}
  #side h1 a{color:var(--acc);text-decoration:none;font-weight:400;text-transform:none;letter-spacing:0}
  #who{padding:0 14px 4px;color:var(--mut);font-size:11px}
  #prog{padding:0 14px 10px;color:var(--mut);font-size:12px}
  .item{padding:8px 14px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:8px;align-items:baseline}
  .item:hover{background:#232732} .item.cur{background:#27314a}
  .item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .conf{color:var(--mut);font-size:11px;flex:0 0 auto}
  /* main */
  #main{flex:1;display:flex;min-width:0}
  #scanwrap{flex:1;display:flex;flex-direction:column;min-width:0;background:#0e0f12}
  #scanbar{display:flex;justify-content:flex-end;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}
  #scanbar button{background:#2c313c;color:var(--mut);font-size:12px;padding:6px 12px}
  #scan{flex:1;overflow:auto;padding:16px;text-align:center}
  .pg{display:flex;align-items:center;justify-content:center;margin-bottom:12px;overflow:hidden}
  .pg img{max-width:100%;border-radius:6px;box-shadow:0 2px 12px #0008;transition:transform .15s ease}
  #edit{width:46%;flex:0 0 46%;border-left:1px solid var(--line);overflow:auto;padding:18px 20px}
  .row{margin-bottom:14px} label{display:block;color:var(--mut);font-size:12px;margin-bottom:4px;text-transform:uppercase;letter-spacing:.03em}
  input,textarea{width:100%;background:#12141a;border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:8px 10px;font:inherit;resize:vertical}
  textarea{min-height:120px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
  #name{font-size:17px;font-weight:600}
  .badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .b{font-size:11px;padding:2px 8px;border-radius:999px;background:#2a2f3a;color:var(--mut)}
  .b.conf{background:#1f3a26;color:#9be0ab} .b.lowconf{background:#3a2520;color:#e6a79e}
  .bar{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:12px;margin:18px -20px -18px;display:flex;gap:8px;flex-wrap:wrap}
  button{font:inherit;border:0;border-radius:6px;padding:9px 14px;cursor:pointer;font-weight:600}
  button:disabled{opacity:.5;cursor:default}
  .save{background:#2c313c;color:var(--fg)} .approve{background:var(--ok);color:#06210f}
  .reject{background:var(--rej);color:#2a0c0a} .nav{background:#2c313c;color:var(--mut)}
  .save.dirty{outline:2px solid var(--warn)}
  details{margin-top:6px} summary{cursor:pointer;color:var(--mut);font-size:12px}
  pre{white-space:pre-wrap;background:#12141a;border:1px solid var(--line);border-radius:6px;padding:10px;font-size:12px;color:var(--mut)}
  .hint{color:var(--mut);font-size:11px;margin-top:4px}
  #empty{margin:auto;color:var(--mut);text-align:center;padding:40px}
  #err{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;background:#3a2520;color:#e6a79e;
       border:1px solid var(--rej);border-radius:8px;padding:10px 16px;display:none;max-width:90%;z-index:10}
  /* upload view */
  #upload{flex:1;overflow:auto;padding:20px;display:none;max-width:640px}
  #drop{border:2px dashed var(--line);border-radius:10px;padding:28px;text-align:center}
  #drop.hover{border-color:var(--acc);background:#1a2231}
  #upresults{margin-top:14px}
  .up{display:flex;gap:10px;padding:6px 4px;border-bottom:1px solid var(--line);font-size:13px}
  .up .st{flex:0 0 90px;font-weight:600}
  .up .st.queued{color:var(--ok)} .up .st.duplicate{color:var(--warn)} .up .st.error{color:var(--rej)}
  .up .fn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .up .dt{color:var(--mut)}
  /* status view */
  #status{flex:1;overflow:auto;padding:20px;display:none}
  #status h2{font-size:15px;margin:18px 0 8px}
  .cards{display:flex;gap:10px;flex-wrap:wrap}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 18px;min-width:110px}
  .card .n{font-size:22px;font-weight:700} .card .l{color:var(--mut);font-size:12px}
  table{border-collapse:collapse;width:100%;font-size:13px}
  td,th{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left}
  th{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.03em}
  /* phone: stack everything */
  @media (max-width: 900px){
    body{flex-direction:column;height:auto;min-height:100vh}
    #side{width:100%;flex:0 0 auto;max-height:35vh;border-right:0;border-bottom:1px solid var(--line)}
    #main{flex-direction:column}
    #scanwrap{max-height:50vh;flex:0 0 auto}
    #edit{width:100%;flex:1 1 auto;border-left:0;border-top:1px solid var(--line)}
    .bar{position:sticky}
    button{padding:12px 16px}
  }
</style></head>
<body>
  <div id="side">
    <h1>Needs review <span><a href="#" onclick="toggleUpload(event)">upload</a> &middot; <a href="#" onclick="toggleStatus(event)">status</a></span></h1>
    <div id="who"></div><div id="prog"></div><div id="list"></div>
  </div>
  <div id="main">
    <div id="scanwrap">
      <div id="scanbar"><button onclick="rotate()" title="Rotate scan 90&deg;">&#8635; Rotate</button></div>
      <div id="scan"></div>
    </div>
    <div id="edit"></div>
  </div>
  <div id="status"></div>
  <div id="upload">
    <div id="drop">
      <p><strong>Add recipe scans to the pipeline</strong></p>
      <p class="hint">PDFs, photos (JPEG/PNG/HEIC), or a ZIP of them. Drop files here or</p>
      <button class="save" onclick="document.getElementById('picker').click()">Choose files</button>
      <input id="picker" type="file" multiple accept=".pdf,.jpg,.jpeg,.png,.heic,.zip"
             style="display:none" onchange="uploadFiles(this.files); this.value=''">
      <p class="hint">Uploads wait in the processing queue until the scanner worker digitizes
        them; they appear here for review after that.</p>
    </div>
    <div id="upresults"></div>
  </div>
  <div id="err"></div>
<script>
let Q=[], cur=-1, busy=false;
let loadedId=null;   // the job whose data is IN the editor (saves target this, never Q[cur])
let dirty=false;     // unsaved edits present
let openSeq=0;       // guards out-of-order /api/recipes responses on rapid clicks
let rot=0;           // scan rotation for the current recipe (degrees)
const $=s=>document.querySelector(s);

async function jfetch(url, opts){
  let r;
  try {
    // redirect:'manual' turns the forward-auth 302 (expired Authentik session) into an
    // opaqueredirect we can detect, instead of an opaque CORS failure mid-render.
    r = await fetch(url, {...opts, redirect:'manual'});
  } catch(e){ throw new Error('network error — are you offline?'); }
  if (r.type === 'opaqueredirect' || r.status === 0){
    // Session expired: a full page load runs the Authentik login flow and comes back.
    sessionStorage.setItem('resume', location.hash);
    location.reload();
    throw new Error('session expired — reloading to sign in');
  }
  if(!r.ok){ let d=''; try{ d=(await r.json()).detail||''; }catch(e){}
    throw new Error(d || (r.status+' '+r.statusText)); }
  return r.json();
}
function err(msg){ const e=$('#err'); e.textContent=msg; e.style.display='block';
  clearTimeout(err.t); err.t=setTimeout(()=>e.style.display='none', 8000); }

async function load(){
  try{ const me=await jfetch('/api/me'); $('#who').textContent='signed in as '+me.user; }catch(e){}
  try{ Q=await jfetch('/api/queue'); }catch(e){ err('Could not load the queue: '+e.message); return; }
  renderList();
  const want=(sessionStorage.getItem('resume')||location.hash).replace('#','');
  sessionStorage.removeItem('resume');
  const idx=Q.findIndex(r=>r.id===want);
  if(Q.length) openRecipe(idx>=0?idx:0);
  else $('#scan').innerHTML='<div id=empty>Queue is empty — nothing needs review.</div>';
}
function renderList(){
  $('#prog').textContent=Q.length+' left to review';
  $('#list').innerHTML=Q.map((r,i)=>`<div class="item ${i===cur?'cur':''}" onclick="openRecipe(${i})">
      <span class="nm">${esc(r.name)}</span>
      <span class="conf">${(r.confidence*100|0)}%</span></div>`).join('');
}

// NOTE: never name a global handler `open`/`close` — inline onclick resolves through
// the DOCUMENT before window, so onclick="open(i)" called document.open() and blanked
// the page (the reported white-screen bug).
async function openRecipe(i){
  if(i<0||i>=Q.length) return;
  if(dirty && !(await save(true))) return;   // autosave edits; stay put if it fails
  cur=i; renderList(); showReview();
  document.querySelectorAll('.item')[i]?.scrollIntoView({block:'nearest'});
  const seq=++openSeq;
  let r;
  try{ r=await jfetch('/api/recipes/'+Q[i].id); }
  catch(e){ err('Could not load "'+Q[i].name+'": '+e.message); return; }
  if(seq!==openSeq) return;                  // a newer click superseded this response
  loadedId=r.id; dirty=false; rot=0;
  history.replaceState(null,'','#'+r.id);    // reload/share returns to THIS recipe
  $('#scan').innerHTML=r.pages.map(p=>
    `<div class="pg"><img src="/api/recipes/${r.id}/pages/${p}" onload="applyRot(this.parentNode)"></div>`
  ).join('')||'<div id=empty>no scan image</div>';
  $('#scan').scrollTop=0;
  const lc=r.confidence!=null&&r.confidence<0.7;
  $('#edit').innerHTML=`
    <div class="badges">
      <span class="b ${lc?'lowconf':'conf'}">confidence ${r.confidence!=null?(r.confidence*100|0)+'%':'?'}</span>
      ${r.flags.map(f=>`<span class="b">${esc(f)}</span>`).join('')}</div>
    <div class="row"><label>Title</label><input id="name" value="${esc(r.name)}"></div>
    <div class="row"><label>Description</label><input id="desc" value="${esc(r.description)}"></div>
    <div class="row"><label>Ingredients (one per line)</label><textarea id="ings">${esc(r.ingredients.join('\n'))}</textarea></div>
    <div class="row"><label>Instructions (one per line / step)</label><textarea id="insts">${esc(r.instructions.join('\n'))}</textarea></div>
    <details><summary>verbatim OCR (what was actually scanned)</summary><pre>${esc(r.verbatim||'(none)')}</pre></details>
    <div class="hint">Approve sends it to Mealie. Reject = not a recipe (permanent). Arrows just move on; edits auto-save.</div>
    <div class="bar">
      <button class="nav" onclick="openRecipe(cur-1)">&larr;</button>
      <button class="save" onclick="save()">Save</button>
      <button class="approve" onclick="approve()">Approve &rarr; Mealie</button>
      <button class="reject" onclick="reject_()">Reject</button>
      <button class="nav" onclick="openRecipe(cur+1)">&rarr;</button>
    </div>`;
  $('#edit').oninput=()=>{ dirty=true; document.querySelector('.save')?.classList.add('dirty'); };
}

/* --- rotate: fit the rotated footprint inside the pane (90/270 swap the box) --- */
function rotate(){ rot=(rot+90)%360; document.querySelectorAll('#scan .pg').forEach(applyRot); }
function applyRot(box){
  const img=box.querySelector('img');
  if(!img||!img.naturalWidth) return;
  const bw=box.clientWidth||box.parentNode.clientWidth;
  if(rot%180===0){
    img.style.width=''; img.style.maxWidth='100%';
    img.style.transform=rot?`rotate(${rot}deg)`:'';
    box.style.height='';
  } else {
    const scale=bw/img.naturalHeight;                 // rotated width must fit the pane
    img.style.maxWidth='none';
    img.style.width=(img.naturalWidth*scale)+'px';
    img.style.transform=`rotate(${rot}deg)`;
    box.style.height=(img.naturalWidth*scale)+'px';   // visual height after rotation
  }
}

function payload(){return{name:$('#name').value, description:$('#desc').value,
  ingredients:$('#ings').value.split('\n').map(s=>s.trim()).filter(Boolean),
  instructions:$('#insts').value.split('\n').map(s=>s.trim()).filter(Boolean)};}

async function save(silent){
  const id=loadedId;
  if(!id) return true;
  try{
    await jfetch('/api/recipes/'+id,{method:'PATCH',
      headers:{'Content-Type':'application/json'},body:JSON.stringify(payload())});
    dirty=false; document.querySelector('.save')?.classList.remove('dirty');
    if(!silent) flash('saved');
    return true;
  }catch(e){
    err('Save failed: '+e.message+' — your edits are still here, try Save again.');
    return false;
  }
}

async function approve(){
  if(busy) return; busy=true;
  const b=document.querySelector('.approve'), o=b.textContent;
  b.disabled=true; b.textContent='Sending to Mealie…';
  try{
    if(!(await save(true))) throw new Error('could not save your edits first');
    await jfetch('/api/recipes/'+loadedId+'/approve',{method:'POST'});
    dropCurrent();
  }catch(e){ err('Approve failed: '+e.message); b.disabled=false; b.textContent=o; }
  finally{ busy=false; }
}
async function reject_(){
  if(busy) return;
  if(!confirm('Reject permanently? Use this only for things that are not recipes.')) return;
  busy=true;
  try{ await jfetch('/api/recipes/'+loadedId+'/reject',{method:'POST'}); dirty=false; dropCurrent(); }
  catch(e){ err('Reject failed: '+e.message); }
  finally{ busy=false; }
}
function dropCurrent(){ Q.splice(cur,1); if(cur>=Q.length) cur=Q.length-1;
  renderList(); if(Q.length) openRecipe(cur); else { $('#edit').innerHTML=''; history.replaceState(null,'','#');
    $('#scan').innerHTML='<div id=empty>All done — the queue is empty.</div>'; } }
function flash(t){const b=document.querySelector('.save');const o=b.textContent;b.textContent=t;setTimeout(()=>b.textContent=o,800);}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

async function toggleStatus(ev){ ev.preventDefault();
  const st=$('#status'), main=$('#main');
  if(st.style.display==='block'){ showReview(); return; }
  $('#upload').style.display='none';
  let s;
  try{ s=await jfetch('/api/status'); }catch(e){ err('Could not load status: '+e.message); return; }
  const order=['needs_review','queued','processing','uploaded','rejected','failed','approved'];
  st.innerHTML='<div class="cards">'+order.filter(k=>s.counts[k]).map(k=>
      `<div class="card"><div class="n">${s.counts[k]}</div><div class="l">${k.replace('_',' ')}</div></div>`).join('')+'</div>'
    +'<h2>Recent decisions</h2><table><tr><th>source</th><th>status</th><th>by</th><th>when</th><th>mealie</th></tr>'
    +s.recent.map(r=>`<tr><td>${esc(r.source_name)}</td><td>${r.status}</td><td>${esc(r.by||'')}</td>
       <td>${new Date(r.at).toLocaleString()}</td><td>${esc(r.mealie_slug||'')}</td></tr>`).join('')+'</table>';
  main.style.display='none'; st.style.display='block';
}
function showReview(){ $('#status').style.display='none'; $('#upload').style.display='none'; $('#main').style.display='flex'; }
function toggleUpload(ev){ ev.preventDefault();
  const up=$('#upload');
  if(up.style.display==='block'){ showReview(); return; }
  $('#status').style.display='none'; $('#main').style.display='none'; up.style.display='block';
}
async function uploadFiles(files){
  if(!files||!files.length) return;
  const fd=new FormData();
  for(const f of files) fd.append('files', f);
  const res=$('#upresults');
  res.innerHTML='<div class="hint">Uploading '+files.length+' file(s)…</div>';
  let out;
  try{ out=await jfetch('/api/uploads',{method:'POST',body:fd}); }
  catch(e){ res.innerHTML=''; err('Upload failed: '+e.message); return; }
  res.innerHTML=out.results.map(r=>`<div class="up"><span class="st ${r.status}">${r.status}</span>
    <span class="fn">${esc(r.filename)}</span><span class="dt">${esc(r.detail||'')}</span></div>`).join('');
  const q=out.results.filter(r=>r.status==='queued').length;
  if(q) res.innerHTML+=`<div class="hint" style="margin-top:8px">${q} file(s) queued for the pipeline.</div>`;
}
(function(){ const d=document.getElementById('drop'); if(!d) return;
  ['dragover','dragenter'].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.classList.add('hover');}));
  ['dragleave','drop'].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.classList.remove('hover');}));
  d.addEventListener('drop',e=>uploadFiles(e.dataTransfer.files));
})();

window.addEventListener('beforeunload', e=>{ if(dirty){ e.preventDefault(); e.returnValue=''; } });
document.addEventListener('keydown',e=>{ if(e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT'){
    if((e.metaKey||e.ctrlKey)&&e.key==='s'){e.preventDefault();save();} return; }
  if(e.key==='ArrowLeft')openRecipe(cur-1); else if(e.key==='ArrowRight')openRecipe(cur+1);
  else if(e.key==='s')save(); else if(e.key==='a')approve(); else if(e.key==='r')rotate(); });
load();
</script></body></html>
