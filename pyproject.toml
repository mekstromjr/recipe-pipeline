[project]
name = "recipe-pipeline"
version = "0.1.0"
description = "Digitize handwritten/clipping family recipes (scan PDF -> Apple Vision OCR -> structure -> enrich -> Mealie)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.7.0",
    "pillow>=11.1.0",
    "pypdfium2>=4.30.0",
    "deskew>=1.5.1",
    "jiwer>=3.1.0",
]

[project.optional-dependencies]
# Apple Vision OCR backend (on-device, macOS only) — the production OCR engine.
apple = [
    "pyobjc-framework-Vision>=11.0",
    "pyobjc-framework-Quartz>=11.0",
]

[project.scripts]
recipe-pipeline = "recipe_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recipe_pipeline"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# review_server.py embeds an HTML/CSS/JS string with intentionally long lines.
"src/recipe_pipeline/review_server.py" = ["E501"]
