[project]
name = "recipe-pipeline"
version = "0.1.0"
description = "Digitize handwritten/clipping family recipes (scan PDF -> 2x local OCR -> image-grounded reconcile -> enrich -> Mealie)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.7.0",
    "pillow>=11.1.0",
    "pypdfium2>=4.30.0",
    "deskew>=1.5.1",
    "jiwer>=3.1.0",
]

[project.optional-dependencies]
# Apple Vision OCR backend (on-device, macOS only) — the zero-friction baseline engine.
apple = [
    "pyobjc-framework-Vision>=11.0",
    "pyobjc-framework-Quartz>=11.0",
]
# TrOCR backend (transformer) — engine B, benchmarked against Apple Vision.
trocr = [
    "torch>=2.6.0",
    "transformers>=4.49.0",
]
# Kraken backend (CNN-RNN/CTC) — heavier; its real payoff is fine-tuning on a specific hand.
kraken = [
    "kraken>=5.3.0",
]

[project.scripts]
recipe-pipeline = "recipe_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recipe_pipeline"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
