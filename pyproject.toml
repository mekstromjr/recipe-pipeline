# Virtual workspace root for the recipe service.
#   shared/  -> recipe-pipeline-shared : the Recipe model + slug (worker + server share it)
#   worker/  -> recipe-pipeline-worker : OCR pipeline (glm-ocr on Ollama), `recipe-pipeline` CLI
#   server/  -> recipe-pipeline-server : FastAPI control plane in k8s (no OCR deps)
[tool.uv.workspace]
members = ["shared", "worker", "server"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
testpaths = ["shared/tests", "worker/tests", "server/tests"]
pythonpath = ["shared/src", "worker/src", "server/src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# review_server.py embeds an HTML/CSS/JS string with intentionally long lines.
"worker/src/recipe_pipeline/review_server.py" = ["E501"]
